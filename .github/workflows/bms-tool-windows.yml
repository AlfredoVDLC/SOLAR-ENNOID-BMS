name: Build BMS Tool for Windows
on:
  workflow_dispatch:
  push:
    branches: [feature/selectable-lem-current]
    paths:
      - 'ENNOID-BMS-ToolV5.02-alpha2_win32/Fuentes/**'
      - '.github/workflows/bms-tool-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_mingw81
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          cache: true
      - name: Configure and build
        shell: pwsh
        working-directory: ENNOID-BMS-ToolV5.02-alpha2_win32/Fuentes/ENNOID-BMS-Tool-V/ENNOID-BMS-Tool-V
        run: |
          $env:PATH = "$env:IQTA_TOOLS\mingw810_64\bin;$env:PATH"
          Remove-Item .qmake.stash -ErrorAction SilentlyContinue
          qmake ENNOID-BMS-Tool.pro "CONFIG+=release" "CONFIG-=debug"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mingw32-make -j2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item release/*.exe package/
          $exe = (Get-ChildItem package/*.exe | Select-Object -First 1).FullName
          # Deploy the matching Qt runtime explicitly (Qt 5.15 MinGW windeployqt
          # can fail to classify the platform plugin on hosted runners).
          Copy-Item "$env:QT_ROOT_DIR/bin/*.dll" package/
          Copy-Item "$env:IQTA_TOOLS/mingw810_64/bin/*.dll" package/
          Copy-Item "$env:QT_ROOT_DIR/plugins" package/plugins -Recurse
          Copy-Item "$env:QT_ROOT_DIR/qml" package/qml -Recurse
          "[Paths]`nPrefix=.`nPlugins=plugins`nQml2Imports=qml" | Set-Content package/qt.conf
          if (!(Test-Path package/plugins/platforms/qwindows.dll)) {
            throw "Missing Qt Windows platform plugin"
          }
          # Verify startup using only the deployed runtime, not the Qt installation.
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot/system32;$env:SystemRoot"
          $app = Start-Process -FilePath $exe -WorkingDirectory (Resolve-Path package) -PassThru -RedirectStandardError package/startup-stderr.txt
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) { throw "BMS Tool exited during startup: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        with:
          name: BMS-Tool-Windows-LEM-5.2.1-rc1
          path: ENNOID-BMS-ToolV5.02-alpha2_win32/Fuentes/ENNOID-BMS-Tool-V/ENNOID-BMS-Tool-V/package/
